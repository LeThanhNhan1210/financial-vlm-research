# ==============================================================================
# THÔNG SỐ CẤU HÌNH DỮ LIỆU BIỂU ĐỒ TÀI CHÍNH & TIME-SERIES SPLIT
# ==============================================================================

# 1. Danh mục tài sản và khung thời gian thu thập dữ liệu
collection:
  source: "TradingView / Yahoo Finance / Binance"
  asset_classes:
    - name: "VN30"
      symbols: ["VCB", "FPT", "HPG", "MWG", "VIC", "TCB"]
      timeframes: ["1D"]
    - name: "US_Equities"
      symbols: ["SPY", "QQQ", "AAPL", "NVDA", "TSLA"]
      timeframes: ["1D", "4H"]
    - name: "Crypto"
      symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
      timeframes: ["1D", "4H"]

  date_range:
    start_date: "2022-01-01"
    end_date: "2025-12-31"

# 2. Quy chuẩn kết xuất biểu đồ & Chỉ báo kỹ thuật (Technical Indicators)
chart_rendering:
  theme: "dark"                        # Dark mode tăng độ tương phản của thân và bóng nến
  candlestick_count: 60                # Số lượng nến trên mỗi ảnh biểu đồ
  image_width: 512                     # Khống chế 512x512 để tránh bùng nổ token thị giác trên VRAM
  image_height: 512
  dpi: 100
  include_volume: true
  indicators:
    moving_averages:
      - type: "EMA"
        period: 20
        color: "#f1c40f"
      - type: "SMA"
        period: 50
        color: "#3498db"
      - type: "SMA"
        period: 200
        color: "#9b59b6"
    momentum:
      - type: "RSI"
        period: 14
        overbought: 70
        oversold: 30
    volatility:
      - type: "BollingerBands"
        period: 20
        std_dev: 2.0

# 3. Phân chia tập dữ liệu nghiêm ngặt theo trục thời gian (Time-series Split)
# TUYỆT ĐỐI KHÔNG DÙNG RANDOM SHUFFLE - TRIỆT TIÊU HOÀN TOÀN LOOK-AHEAD BIAS
split_strategy:
  type: "time_series"
  train_ratio: 0.70                    # 70% thời gian đầu (T_train)
  val_ratio: 0.15                      # 15% tiếp theo (T_val)
  test_ratio: 0.15                     # 15% cuối cùng (T_test: Dữ liệu tương lai chưa từng thấy)
  purge_overlap_bars: 5                # Khoảng đệm (embargo/purge) tránh rò rỉ nến giao thoa

# 4. Quy chuẩn sinh nhãn Chuỗi suy luận (CoT Labeling) & Rà soát thủ công
cot_labeling:
  generator_model: "gpt-4o"
  temperature: 0.2
  max_tokens: 1024
  human_audit_sample_rate: 0.30        # Tối thiểu 30% mẫu được chuyên gia/nhóm NCKH rà soát
