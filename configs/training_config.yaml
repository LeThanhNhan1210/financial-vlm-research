# Cấu hình huấn luyện tối ưu cho Google Colab GPU T4 (16GB VRAM)
model:
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"  # Hoặc "meta-llama/Llama-3.2-11B-Vision-Instruct"
  torch_dtype: "bfloat16"                  # hoặc float16 nếu T4 không hỗ trợ native bf16
  device_map: "auto"

training:
  output_dir: "./checkpoints/qlora_run"
  num_train_epochs: 3
  per_device_train_batch_size: 1          # Giữ ở mức 1 để tránh OOM trên T4
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16         # Tương đương effective batch size = 16
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 3
  evaluation_strategy: "steps"
  eval_steps: 50
  gradient_checkpointing: true            # Bắt buộc bật để tiết kiệm VRAM
  fp16: true
  bf16: false
  seed: 42
  drive_backup_dir: "/content/drive/MyDrive/NCKH_AI/2_checkpoints"

data:
  train_split: "./data/splits/train.jsonl"
  val_split: "./data/splits/val.jsonl"
  test_split: "./data/splits/test.jsonl"
  max_image_resolution: 512              # Chuẩn hóa resolution tránh bùng nổ visual tokens
