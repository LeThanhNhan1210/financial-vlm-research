# Cấu hình lượng hóa INT4 và LoRA Adapter (PEFT)
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"              # Normal Float 4 tối ưu cho weights
  bnb_4bit_use_double_quant: true         # Lượng hóa kép tiết kiệm thêm 0.4 bit/param
  bnb_4bit_compute_dtype: "float16"

lora:
  r: 16                                   # LoRA rank
  lora_alpha: 32                          # Scaling factor
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:                         # Chỉ áp dụng lên các linear layers của Language Model
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  modules_to_save: null                   # Freeze Vision Encoder hoàn toàn
